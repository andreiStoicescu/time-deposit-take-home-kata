spring:
  application:
    name: time-deposit
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
