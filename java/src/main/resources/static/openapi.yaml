openapi: 3.1.0
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
tags:
  - name: time-deposits
paths:
  /time-deposits:
    get:
      tags: [time-deposits]
      operationId: listTimeDeposits
      summary: List all time deposits with their withdrawals
      responses:
        '200':
          description: All time deposits, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /time-deposits/balance-updates:
    post:
      tags: [time-deposits]
      operationId: updateAllBalances
      summary: Add one month of interest to every time deposit
      description: Each call adds another month of interest, so the operation is not idempotent.
      responses:
        '204':
          description: All balances were updated
components:
  schemas:
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
        planType:
          type: string
          description: Plan code such as basic, student or premium. Unknown plans are listed but earn no interest.
        balance:
          type: number
          format: double
        days:
          type: integer
          format: int32
        withdrawals:
          type: array
          description: Ordered by date, then id
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
        date:
          type: string
          format: date
